syntax = "proto3";
package agent;
option csharp_namespace = "Agent.Proto";

// ============================================================
//  主对话通道：C# (Client)  →  Python (Server)，流式返回
// ============================================================
message ChatRequest {
  string humanmsg = 1;
  string thread_id = 2;
}

message ToolCallEvent{
  string thread_id = 1;
  string tool_name = 2;
  string arguments_json = 3;
}

message ToolResultEvent {
  string thread_id = 1;
  string tool_name = 2;
  string result_json = 3;
}

message DoneEvent {
  string msg = 1;
}

message ChatChunk {
  oneof payload {
    string chunk = 1; // AI 流式文本片段
    ToolCallEvent tool_call = 2; // AI 决定调用工具
    ToolResultEvent tool_result = 3;// 工具执行结果（回显）
    DoneEvent done = 4; // 本次对话结束
  }
}

service ChatService{
  rpc Chat(ChatRequest) returns (stream ChatChunk);
}

// ============================================================
//  工具调用通道：Python (Client)  →  C# (Server)
// ============================================================
message ToolCallRequest {
  string tool_name      = 1;
  string arguments_json = 2;
}

message ToolCallResult {
  bool   success     = 1;
  string result_json = 2;
  string error       = 3;
}

service ToolService {
  rpc CallTool(ToolCallRequest) returns (ToolCallResult);
}

